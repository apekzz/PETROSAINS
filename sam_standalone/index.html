<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAM registration POC</title><link rel="stylesheet" href="/style.css"></head><body>
<main><h1>PETROSAINS · SAM Registration POC</h1><p>Standalone program: it does not use or modify the inventory dashboard.</p>
<section class="controls"><label>Object name <input id="name" placeholder="Example: S001_Pen"></label><label class="file">Choose image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="mask" disabled>Generate SAM mask</button><button id="points" class="active">Point prompts</button><button id="brush">Brush</button><button id="erase">Eraser</button><label>Brush <input id="size" type="range" min="4" max="100" value="24"></label><button id="undo">Undo</button><button id="save" disabled>Embed and register</button></section>
<p id="message">Choose an image. Left click = foreground, right click = background.</p><div id="stage"><canvas id="image"></canvas><canvas id="maskLayer"></canvas><canvas id="pointsLayer"></canvas></div><h2>Masked object preview</h2><canvas id="preview"></canvas></main><script src="/app.js"></script></body></html>
