<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneShot Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/dashboard.css">
</head>

<body>
    <div class="header">
        <h1>
            OneShot
            <span>Inventory</span>
        </h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            LIVE
        </div>
    </div>

    <div class="container">
        <div class="stats-column">
            <div class="stat-card">
                <h3>Total Items</h3>
                <p id="total-items">0</p>
            </div>
            <div class="stat-card">
                <h3>Available</h3>
                <p id="available-items" class="stat-available">0</p>
            </div>
            <div class="stat-card">
                <h3>Checked Out</h3>
                <p id="checked-items" class="stat-checked">0</p>
            </div>
            <div class="stat-card">
                <h3>Low Stock</h3>
                <p id="low-stock" class="stat-low">0</p>
            </div>
        </div>

        <div class="top-right-container">
            <div class="add-item-card" onclick="alert('Function coming soon!')">
                <h2>Add New Item</h2>
                <div class="plus">+</div>
                <p class="hint">Click to Add</p>
            </div>
            <div class="ai-training-card">
                <h2>AI Training</h2>
                <div class="ai-placeholder">
                    <div class="ai-circle"></div>
                    <p class="coming-soon">COMING SOON...</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Live Camera Feed</h2>
            <div class="camera-view">
                <img id="cameraFeed" alt="Live Camera Feed">
                <div id="cameraStatus" class="camera-status">
                    CONNECTING TO CAMERA...
                </div>
            </div>
        </div>

        <div class="card inventory-card">
            <h2>Inventory Matrix</h2>
            <input
                type="text"
                class="search-bar"
                id="searchInput"
                placeholder="Search database..."
            >
            <div class="inventory-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Qty</th>
                            <th>Unit</th>
                            <th>Location</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/dashboard.js"></script>
</body>

</html>
